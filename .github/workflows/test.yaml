name: 'Test'
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: yarn

      - name: Check types
        run: yarn type-check

      - name: Lint
        run: yarn lint

      - name: Run tests
        run: yarn test

      # A few posts are enough to show that pages still build
      - name: Build a sample of the site
        run: yarn build:sample

      # Serves that build and checks it in a real browser
      - name: Run browser tests
        run: yarn test:e2e:ci

      - name: Keep screenshots of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Storybook
        run: yarn build-storybook
