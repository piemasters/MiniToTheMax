name: 'Test'
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: yarn

      - name: Check types
        run: yarn type-check

      - name: Lint
        run: yarn lint

      - name: Run tests
        run: yarn test

      # A few posts are enough to show that pages still build
      - name: Build a sample of the site
        run: yarn build:sample

      - name: Build Storybook
        run: yarn build-storybook
