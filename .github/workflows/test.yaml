name: 'Test'
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: yarn

      - name: Check types
        run: yarn type-check

      - name: Run tests
        run: yarn test

      - name: Build Storybook
        run: yarn build-storybook
