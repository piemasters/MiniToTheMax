# Turns on GitHub's auto-merge for Dependabot's patch and minor updates. GitHub
# then merges each one only once the checks that the branch protection rules
# require have passed: the "test" job in test.yaml. Major updates are left to be
# merged by hand.
#
# Needs "Allow auto-merge" in the repository settings.
name: Dependabot Auto-Merge

# Runs this file as it is on the target branch, and checks out none of the
# update's code, so the token is never exposed to it
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    steps:
      - name: Read what is being updated
        id: metadata
        uses: dependabot/fetch-metadata@v3

      # A personal token, because a merge made with the workflow's own token
      # would not start the deployment
      - name: Merge once the tests pass
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_TOKEN }}

      # An update can become a major one when Dependabot rewrites it
      - name: Leave major updates to be merged by hand
        if: >-
          github.event.pull_request.auto_merge != null &&
          steps.metadata.outputs.update-type != 'version-update:semver-patch' &&
          steps.metadata.outputs.update-type != 'version-update:semver-minor'
        run: gh pr merge --disable-auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_TOKEN }}
