# Builds the Astro site and publishes it to a Netlify preview address.
# The live site is untouched: that is deploy.yaml, which runs on master.
name: 'Astro Preview'

on:
  push:
    branches: [astro]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest push needs a preview
concurrency:
  group: astro-preview
  cancel-in-progress: true

jobs:
  netlify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: yarn

      # Only the processed images: Astro's other cached data can go stale
      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ hashFiles('yarn.lock', 'content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.png', 'content/**/*.webp', 'src/assets/**') }}
          restore-keys: astro-images-

      - name: Build every post
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          DISQUS_NAME: ${{ secrets.DISQUS_NAME }}
          # Preview visits stay out of analytics unless the repository
          # variable PREVIEW_ANALYTICS is set to true
          GA_TRACKING_ID: ${{ vars.PREVIEW_ANALYTICS == 'true' && secrets.GA_TRACKING_ID || '' }}

      # Without --prod this is a draft deploy, with a fixed alias
      - name: Deploy preview to Netlify
        run: >
          npx --yes netlify-cli@27 deploy
          --no-build
          --dir=dist
          --alias=astro-preview
          --message="Astro preview of ${GITHUB_SHA::8}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
