name: 'Deploy'

on: push
jobs:
  netlify-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.actor != 'dependabot[bot]'
    steps:
      # public/ now holds only static files, so publishing it would empty the
      # live site. Remove this step when switching the deployment to Astro.
      - name: Stop until deployment is switched to Astro
        run: |
          echo "::error::Production deployment has not been switched to Astro yet"
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: yarn
      - name: Build project
        run: yarn build
        env:
          DISQUS_NAME: ${{ secrets.DISQUS_NAME }}
          GA_TRACKING_ID: ${{ secrets.GA_TRACKING_ID }}
          OPT_CONTAINER_ID: ${{ secrets.OPT_CONTAINER_ID }}
      - name: Run tests
        run: yarn test
      - name: Deploy to Netlify
        run: npx netlify-cli deploy --prod --dir=public
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
