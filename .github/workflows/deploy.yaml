# Builds the site and publishes it to the live address on Netlify.
name: 'Deploy'

on:
  push:
    branches: [master]

permissions:
  contents: read

# One at a time, so an older build never publishes over a newer one. A running
# deployment finishes, and only the latest of those waiting follows it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  netlify-deploy:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: yarn

      - name: Run tests
        run: yarn test

      # Only the processed images: Astro's other cached data can go stale
      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ hashFiles('yarn.lock', 'content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.png', 'content/**/*.webp', 'src/assets/**') }}
          restore-keys: astro-images-

      - name: Build every post
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          DISQUS_NAME: ${{ secrets.DISQUS_NAME }}
          GA_TRACKING_ID: ${{ secrets.GA_TRACKING_ID }}

      - name: Deploy to Netlify
        run: >
          npx --yes netlify-cli@27 deploy
          --prod
          --no-build
          --dir=dist
          --message="Deploy of ${GITHUB_SHA::8}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
